[package]
name = "unity-formats"
description = "Reads Unity games' data files: SerializedFiles, scenes, meshes, textures, shader programs and Animator data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["unity", "assets", "modding", "serialized-file", "game-assets"]
categories = ["parser-implementations", "game-development"]
documentation = "https://docs.rs/unity-formats"
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
thiserror.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/unity-formats"
publish = false

[workspace.dependencies]
half = { version = "=2.7.1", default-features = false }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "dc4369b73343f3e0d81adc47f2e504027efc1d5a" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "d0258530ca9ca0ca74e957716ae8683e7facc8a7" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
