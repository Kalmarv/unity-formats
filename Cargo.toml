[package]
name = "unity-formats"
description = "Unity players' data files: SerializedFile containers, type trees, streamed resources and the objects of a scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
thiserror.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/unity-formats"
publish = false

[workspace.dependencies]
half = { version = "=2.7.1", default-features = false }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "05dc616e7bd14cad63c4e5218be6e8b79cee60ce" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "71a28a5b188b259e1d49681823aa00996260f544" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
